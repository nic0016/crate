[package]
name = "cad-crate"
version = "0.1.0"
edition = "2021"
description = "Git-ähnliche Versionskontrolle für CAD-Daten (WAL + inhaltsadressierte Blobs)"

[[bin]]
name = "crate"
path = "src/main.rs"

[lib]
name = "cad_crate"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["pure"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
fastcdc = "3"
flate2 = "1"
ignore = "0.4"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
